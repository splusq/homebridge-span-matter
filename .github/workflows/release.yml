name: Release

# Publishes to npm in two ways:
# - Every other day (or on demand), if anything that ships changed since the
#   latest v* tag, it bumps the patch version, publishes, and creates the tag
#   and GitHub release. With no changes it exits early.
# - When a GitHub release is published by hand, it publishes that tag's
#   version. Prerelease GitHub releases go out under the "beta" dist-tag.
#
# Git tags are the source of truth for the version: bumps are not committed
# back to main, so package.json in the repo may lag behind npm.
on:
  schedule:
    - cron: "0 15 */2 * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # create tags and releases
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- \
              src package.json package-lock.json tsconfig.json config.schema.json README.md; then
            echo "No changes since $last; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${last#v}"
          base="${base:-$(node -p "require('./package.json').version")}"
          next="$(npx --yes semver@7 -i patch "$base")"
          echo "Releasing $next (changes since ${last:-the beginning})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "create_release=true" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - if: steps.version.outputs.publish == 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # prepublishOnly runs the build and tests
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}

      - name: Create tag and GitHub release
        if: steps.version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
